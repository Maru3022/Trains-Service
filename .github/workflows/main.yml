name: CI/CD
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      operation:
        description: Deployment operation
        type: choice
        options: [none, deploy-production, rollback-production]
        default: none
      image_digest:
        description: Existing GHCR digest (sha256:...) for production deploy or rollback
        required: false
        type: string
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
env:
  JAVA_VERSION: '21'
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/trains-service
  STAGING_NAMESPACE: trains-service-staging
  PRODUCTION_NAMESPACE: trains-service
jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.7.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Verify application
        run: ./mvnw -B -ntp clean verify
      - name: Install kubeconform
        shell: bash
        run: |
          version=0.6.7
          base="https://github.com/yannh/kubeconform/releases/download/v${version}"
          curl --fail --silent --show-error --location --output kubeconform.tar.gz "${base}/kubeconform-linux-amd64.tar.gz"
          curl --fail --silent --show-error --location --output CHECKSUMS "${base}/CHECKSUMS"
          grep 'kubeconform-linux-amd64.tar.gz' CHECKSUMS | sha256sum --check
          tar -xzf kubeconform.tar.gz kubeconform
      - name: Render Kubernetes manifests
        run: kubectl kustomize k8s > rendered-k8s.yaml
      - name: Validate rendered Kubernetes manifests
        run: ./kubeconform -strict -summary -ignore-missing-schemas rendered-k8s.yaml
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: trains-service-test-reports-${{ github.run_id }}
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            target/site/jacoco/
          if-no-files-found: ignore
          retention-days: 7
  publish:
    name: Publish image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.publish.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and publish immutable image
        id: publish
        shell: bash
        run: |
          image="${IMAGE_NAME,,}"
          docker build --label "org.opencontainers.image.revision=${GITHUB_SHA}" -t "${image}:${GITHUB_SHA}" .
          push_output="$(docker push "${image}:${GITHUB_SHA}")"
          printf '%s\n' "$push_output"
          digest="$(printf '%s\n' "$push_output" | awk '/digest: sha256:/ {print $2}' | tail -1)"
          test -n "$digest"
          echo "image=${image}@${digest}" >> "$GITHUB_OUTPUT"
  deploy-staging:
    name: Deploy staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: trains-service-staging
      cancel-in-progress: false
    environment: staging
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - name: Configure Kubernetes
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_STAGING }}
        run: |
          test -n "$KUBECONFIG_B64"
          mkdir -p "$RUNNER_TEMP/kube"
          echo "$KUBECONFIG_B64" | base64 -d > "$RUNNER_TEMP/kube/config"
          chmod 600 "$RUNNER_TEMP/kube/config"
          echo "KUBECONFIG=$RUNNER_TEMP/kube/config" >> "$GITHUB_ENV"
      - name: Deploy published digest
        env:
          IMAGE: ${{ needs.publish.outputs.image }}
        run: |
          kubectl set image deployment/trains-service trains-service="$IMAGE" -n "$STAGING_NAMESPACE"
          kubectl rollout status deployment/trains-service -n "$STAGING_NAMESPACE" --timeout=180s
      - name: Smoke test through the service
        run: |
          kubectl -n "$STAGING_NAMESPACE" port-forward service/trains-service 18080:8080 > "$RUNNER_TEMP/port-forward.log" 2>&1 &
          pid=$!
          trap 'kill $pid' EXIT
          for attempt in {1..30}; do
            curl --fail --silent --show-error http://127.0.0.1:18080/actuator/health/readiness && exit 0
            sleep 2
          done
          cat "$RUNNER_TEMP/port-forward.log"
          exit 1
  production:
    name: Production deploy or rollback
    if: github.event_name == 'workflow_dispatch' && inputs.operation != 'none'
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: trains-service-production
      cancel-in-progress: false
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - name: Validate immutable digest input
        shell: bash
        run: |
          [[ "${{ inputs.image_digest }}" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "image_digest must come from a successful Publish image job"
            exit 1
          }
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - name: Configure Kubernetes
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_PRODUCTION }}
        run: |
          test -n "$KUBECONFIG_B64"
          mkdir -p "$RUNNER_TEMP/kube"
          echo "$KUBECONFIG_B64" | base64 -d > "$RUNNER_TEMP/kube/config"
          chmod 600 "$RUNNER_TEMP/kube/config"
          echo "KUBECONFIG=$RUNNER_TEMP/kube/config" >> "$GITHUB_ENV"
      - name: Deploy selected digest
        shell: bash
        run: |
          image="${IMAGE_NAME,,}@${{ inputs.image_digest }}"
          kubectl set image deployment/trains-service trains-service="$image" -n "$PRODUCTION_NAMESPACE"
          kubectl rollout status deployment/trains-service -n "$PRODUCTION_NAMESPACE" --timeout=300s
