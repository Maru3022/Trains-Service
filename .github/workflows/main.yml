name: Java CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      deploy-production:
        description: 'Deploy latest image to production'
        required: false
        default: 'false'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '21'
  K8S_NAMESPACE_STAGING: trains-service-staging
  K8S_NAMESPACE_PROD: trains-service

jobs:
  build:
    name: 🔨 Build & Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ☕ Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: 📦 Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: 🧪 Build and run unit tests
        run: ./mvnw -B -Dspring.profiles.active=test clean package

      - name: 📦 Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar
          retention-days: 1

  integration-tests:
    name: 🔗 Integration Tests
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ☕ Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: 📦 Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: target/

      - name: 🧪 Run integration tests
        run: ./mvnw -B -Dspring.profiles.active=test verify -Dsurefire.failIfNoSpecifiedTests=false
        env:
          DB_URL: jdbc:postgresql://localhost:5432/trains_db
          DB_USERNAME: trains_user
          DB_PASSWORD: secret
          SPRING_KAFKA_BOOTSTRAP_SERVERS: localhost:9092

  package:
    name: 🧱 Package Docker Image
    runs-on: ubuntu-latest
    needs: [ build, integration-tests ]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    outputs:
      image_name: ${{ steps.set-image.outputs.image_name }}

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: target/

      - name: 🏷️ Set image name (lowercase owner)
        id: set-image
        run: |
          OWNER=${GITHUB_REPOSITORY%%/*}
          OWNER_LOWER=$(echo "${OWNER}" | tr '[:upper:]' '[:lower:]')
          IMAGE=ghcr.io/${OWNER_LOWER}/trains-service
          echo "image_name=${IMAGE}" >> $GITHUB_OUTPUT
          echo "IMAGE_NAME=${IMAGE}" >> $GITHUB_ENV

      - name: 🔑 Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🛠️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🐳 Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache,mode=max
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

  deploy-staging:
    name: 🚀 Deploy to Staging
    runs-on: ubuntu-latest
    needs: package
    environment:
      name: staging

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ⚙️ Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: 🔐 Configure kubeconfig
        id: kubeconfig
        continue-on-error: true
        run: |
          mkdir -p ~/.kube
          if [ -z "${{ secrets.KUBECONFIG_STAGING }}" ]; then
            echo "⚠️ KUBECONFIG_STAGING not configured. Skipping deployment."
            echo "configured=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "${{ secrets.KUBECONFIG_STAGING }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
          kubectl config view --minify
          echo "configured=true" >> $GITHUB_OUTPUT

      - name: 🏷️ Set staging image tag
        if: steps.kubeconfig.outputs.configured == 'true' && github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          cd k8s
          kustomize edit set namespace ${{ env.K8S_NAMESPACE_STAGING }}
          kustomize edit set image trains-service=${{ needs.package.outputs.image_name }}:${{ github.sha }}

      - name: 🚀 Deploy to staging
        if: steps.kubeconfig.outputs.configured == 'true' && github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: kubectl apply -k k8s/ --validate=false

      - name: ⏳ Wait for rollout
        if: steps.kubeconfig.outputs.configured == 'true' && github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          kubectl rollout status deployment/trains-service \
            -n ${{ env.K8S_NAMESPACE_STAGING }} \
            --timeout=180s

      - name: 🔄 Restore kustomization
        if: always() && steps.kubeconfig.outputs.configured == 'true'
        run: |
          cd k8s
          git checkout kustomization.yaml

  deploy-production:
    name: 🏁 Deploy to Production
    runs-on: ubuntu-latest
    needs: package
    environment:
      name: production

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ⚙️ Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: 🔐 Configure kubeconfig
        id: kubeconfig
        continue-on-error: true
        run: |
          mkdir -p ~/.kube
          if [ -z "${{ secrets.KUBECONFIG_PRODUCTION }}" ]; then
            echo "⚠️ KUBECONFIG_PRODUCTION not configured. Skipping deployment."
            echo "configured=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "${{ secrets.KUBECONFIG_PRODUCTION }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
          kubectl config view --minify
          echo "configured=true" >> $GITHUB_OUTPUT

      - name: 🏷️ Set production image tag
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.deploy-production == 'true' && steps.kubeconfig.outputs.configured == 'true'
        run: |
          cd k8s
          kustomize edit set namespace ${{ env.K8S_NAMESPACE_PROD }}
          kustomize edit set image trains-service=${{ needs.package.outputs.image_name }}:${{ github.sha }}

      - name: 🚀 Deploy to production
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.deploy-production == 'true' && steps.kubeconfig.outputs.configured == 'true'
        run: kubectl apply -k k8s/ --validate=false

      - name: ⏳ Wait for rollout
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.deploy-production == 'true' && steps.kubeconfig.outputs.configured == 'true'
        run: |
          kubectl rollout status deployment/trains-service \
            -n ${{ env.K8S_NAMESPACE_PROD }} \
            --timeout=300s

      - name: 🔄 Restore kustomization
        if: always() && steps.kubeconfig.outputs.configured == 'true'
        run: |
          cd k8s
          git checkout kustomization.yaml

